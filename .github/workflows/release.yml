name: Build and publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    if: github.repository == 'ruiange/sing-box-panel'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.5.0'

      - name: Build frontend and test Go
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          go test -mod=readonly ./...

      - name: Build and verify installation package
        run: |
          PANEL_VERSION="$RELEASE_TAG" bash deploy/package.sh "$ARCH"
          archive="sing-box-panel-linux-$ARCH.tar.gz"
          (cd bin && sha256sum --check "$archive.sha256")
          mkdir -p release-assets "$RUNNER_TEMP/sing-box-package"
          tar -xzf "bin/$archive" -C "$RUNNER_TEMP/sing-box-package"
          test "$("$RUNNER_TEMP/sing-box-package/bin/sing-box-panel" version)" = "$RELEASE_TAG"
          cp "bin/$archive" "bin/$archive.sha256" release-assets/

      - name: Test first HTTP installation
        if: matrix.arch == 'amd64'
        run: |
          if ! command -v ss >/dev/null || ! command -v openssl >/dev/null ||
              [[ ! -x /usr/bin/pkcheck || ! -d /etc/polkit-1/rules.d ]]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2 openssl polkitd
          fi
          if ! (
            sudo bash "$RUNNER_TEMP/sing-box-package/install.sh" --http --multiprotocol 8.8.8.8 >/dev/null &&
            systemctl is-active --quiet sing-box-panel.service &&
            systemctl is-active --quiet sing-box-panel-node.service &&
            curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:9443/api/auth/session
          ); then
            sudo journalctl --no-pager -n 150 -u sing-box-panel.service -u sing-box-panel-node.service -u polkit.service
            exit 1
          fi

      - name: Collect bootstrap and corresponding sing-box source
        if: matrix.arch == 'amd64'
        run: |
          sed "s/^bundled_version=$/bundled_version=$RELEASE_TAG/" deploy/install-from-release.sh > release-assets/install-from-release.sh
          grep --fixed-strings --line-regexp "bundled_version=$RELEASE_TAG" release-assets/install-from-release.sh
          bash -n release-assets/install-from-release.sh
          source_info="$RUNNER_TEMP/sing-box-package/licenses/sing-box-SOURCE.txt"
          module=$(sed -n 's/^Go module: //p' "$source_info")
          checksum=$(sed -n 's/^Module checksum: //p' "$source_info")
          [[ $module == github.com/sagernet/sing-box@v* && $checksum == h1:* ]]
          source_zip=$(
            cd /
            go mod download -json "$module" |
              jq -er --arg checksum "$checksum" 'select(.Sum == $checksum) | .Zip | strings'
          )
          cp "$source_zip" "release-assets/sing-box-core-${module##*@}-source.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify and publish release assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          core_sources=(sing-box-core-v*-source.zip)
          test "${#core_sources[@]}" -eq 1
          files=(
            install-from-release.sh
            sing-box-panel-linux-amd64.tar.gz
            sing-box-panel-linux-amd64.tar.gz.sha256
            sing-box-panel-linux-arm64.tar.gz
            sing-box-panel-linux-arm64.tar.gz.sha256
            "${core_sources[0]}"
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          sha256sum --check sing-box-panel-linux-{amd64,arm64}.tar.gz.sha256

          if ! release=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft); then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
            release=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft)
          fi
          release_id=$(jq -er .databaseId <<< "$release")
          if [[ $(jq -r .isDraft <<< "$release") == true ]]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          fi

          assets=$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100")
          for file in "${files[@]}"; do
            checksum=$(sha256sum "$file")
            digest=$(jq -er --arg name "$file" '.[] | select(.name == $name and .state == "uploaded") | .digest' <<< "$assets")
            if [[ $digest != "sha256:${checksum%% *}" ]]; then
              printf 'Release asset checksum differs: %s\n' "$file" >&2
              exit 1
            fi
          done
          if [[ $(jq -r .isDraft <<< "$release") == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
