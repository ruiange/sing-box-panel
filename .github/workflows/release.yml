name: Build and publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    if: github.repository == 'ruiange/sing-box-panel'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.5.0'

      - name: Build frontend and test Go
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          go test -mod=readonly ./...

      - name: Build and verify installation package
        run: |
          PANEL_VERSION="$RELEASE_TAG" bash deploy/package.sh "$ARCH"
          archive="sing-box-panel-linux-$ARCH.tar.gz"
          (cd bin && sha256sum --check "$archive.sha256")
          mkdir -p release-assets "$RUNNER_TEMP/sing-box-package"
          tar -xzf "bin/$archive" -C "$RUNNER_TEMP/sing-box-package"
          test "$("$RUNNER_TEMP/sing-box-package/bin/sing-box-panel" version)" = "$RELEASE_TAG"
          for script in update.sh deploy/dsb.sh; do
            bash -n "$RUNNER_TEMP/sing-box-package/$script"
          done
          cp "bin/$archive" "bin/$archive.sha256" release-assets/

      - name: Test first HTTP installation
        if: matrix.arch == 'amd64'
        run: |
          if ! command -v ss >/dev/null || ! command -v openssl >/dev/null ||
              [[ ! -x /usr/bin/pkcheck || ! -d /etc/polkit-1/rules.d ]]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2 openssl polkitd
          fi
          if ! (
            sudo bash "$RUNNER_TEMP/sing-box-package/install.sh" --http --multiprotocol 8.8.8.8 >/dev/null &&
            systemctl is-active --quiet sing-box-panel.service &&
            systemctl is-active --quiet sing-box-panel-node.service &&
            test "$(/usr/local/bin/dsb 1)" = "$RELEASE_TAG" &&
            curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:9443/api/auth/session
          ); then
            sudo journalctl --no-pager -n 150 -u sing-box-panel.service -u sing-box-panel-node.service -u polkit.service
            exit 1
          fi

      - name: Collect bootstrap and corresponding sing-box source
        if: matrix.arch == 'amd64'
        run: |
          sed "s/^bundled_version=$/bundled_version=$RELEASE_TAG/" deploy/install-from-release.sh > release-assets/install-from-release.sh
          grep --fixed-strings --line-regexp "bundled_version=$RELEASE_TAG" release-assets/install-from-release.sh
          bash -n release-assets/install-from-release.sh
          source_info="$RUNNER_TEMP/sing-box-package/licenses/sing-box-SOURCE.txt"
          module=$(sed -n 's/^Go module: //p' "$source_info")
          checksum=$(sed -n 's/^Module checksum: //p' "$source_info")
          [[ $module == github.com/sagernet/sing-box@v* && $checksum == h1:* ]]
          source_zip=$(
            cd /
            go mod download -json "$module" |
              jq -er --arg checksum "$checksum" 'select(.Sum == $checksum) | .Zip | strings'
          )
          cp "$source_zip" "release-assets/sing-box-core-${module##*@}-source.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  test-upgrade:
    name: Test in-place update on Linux amd64
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-amd64
          path: release-assets

      - name: Install the v0.1.3 baseline
        run: |
          if ! command -v ss >/dev/null || ! command -v openssl >/dev/null ||
              [[ ! -x /usr/bin/pkcheck || ! -d /etc/polkit-1/rules.d ]]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2 openssl polkitd
          fi
          baseline="$RUNNER_TEMP/sing-box-baseline"
          mkdir -m 0700 "$baseline"
          archive=sing-box-panel-linux-amd64.tar.gz
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 120 --output "$baseline/$archive" \
            "https://github.com/ruiange/sing-box-panel/releases/download/v0.1.3/$archive"
          (cd "$baseline" && printf '%s  %s\n' cad9d49a63ff9529775b600fad91309664b5e3d7fbb933ca7808b2289745518d "$archive" |
            sha256sum --check)
          tar -xzf "$baseline/$archive" -C "$baseline"
          sudo bash "$baseline/install.sh" --http --multiprotocol 8.8.8.8 18443 19443 >/dev/null
          test "$(/usr/local/bin/sing-box-panel version)" = v0.1.3
          test ! -e /usr/local/bin/dsb

      - name: Update via the release bootstrap and verify data
        run: |
          # Serve the candidate artifacts locally before the new release is published.
          cat > "$RUNNER_TEMP/upgrade-fixture.bash" <<'BASH'
          curl() {
            local destination= url= asset
            local -a args=("$@")
            while (( $# )); do
              case $1 in
                --output|-o) destination=$2; shift 2 ;;
                http://*|https://*) url=$1; shift ;;
                *) shift ;;
              esac
            done
            case $url in
              https://github.com/ruiange/sing-box-panel/releases/latest/download/install-from-release.sh)
                asset=install-from-release.sh ;;
              "https://github.com/ruiange/sing-box-panel/releases/download/$RELEASE_TAG"/sing-box-panel-linux-amd64.tar.gz*)
                asset=${url##*/} ;;
              http://127.0.0.1:*|https://127.0.0.1:*)
                /usr/bin/curl "${args[@]}"
                return ;;
              *)
                printf 'Unexpected download in update test: %s\n' "$url" >&2
                return 1 ;;
            esac
            cp -- "$RELEASE_ASSETS/$asset" "$destination"
          }
          BASH
          chmod 0600 "$RUNNER_TEMP/upgrade-fixture.bash"

          sudo env BASH_ENV="$RUNNER_TEMP/upgrade-fixture.bash" RELEASE_TAG="$RELEASE_TAG" \
            RELEASE_ASSETS="$GITHUB_WORKSPACE/release-assets" python3 - <<'PY'
          from contextlib import closing
          from hashlib import sha256
          from http.cookiejar import CookieJar
          import json
          import os
          from pathlib import Path
          import sqlite3
          import subprocess
          from tempfile import TemporaryDirectory
          from urllib.request import HTTPCookieProcessor, ProxyHandler, Request, build_opener

          env_path = Path("/etc/sing-box-panel/panel.env")
          state_path = Path("/var/lib/sing-box-panel")
          panel_unit = "sing-box-panel.service"
          node_unit = "sing-box-panel-node.service"
          core = Path("/usr/local/bin/sing-box-panel-core")
          dsb = Path("/usr/local/bin/dsb")
          release = os.environ["RELEASE_TAG"]
          baseline_env = env_path.read_bytes()
          password = next(line.partition("=")[2] for line in baseline_env.decode().splitlines()
                          if line.startswith("PANEL_ADMIN_PASSWORD="))

          def request(client, route, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request("http://127.0.0.1:19443" + route, data,
                                {"Content-Type": "application/json"})
              with client.open(request, timeout=30) as response:
                  body = json.load(response)
              assert body["code"] == 0, f"API request failed: {route}"
              return body["data"]

          def client():
              opener = build_opener(ProxyHandler({}), HTTPCookieProcessor(CookieJar()))
              assert request(opener, "/api/auth/login", {"password": password})["authenticated"]
              return opener

          def invocation(unit):
              return subprocess.check_output(
                  ["systemctl", "show", "-p", "InvocationID", "--value", unit], text=True
              ).strip()

          device = request(client(), "/api/devices", {"name": "CI upgrade fixture"})
          with closing(sqlite3.connect(state_path / "panel.db")) as db, db:
              db.execute("INSERT INTO traffic_daily(device_id, day, upload, download) VALUES (?, ?, ?, ?)",
                         (device["id"], "2024-05-01", 12345, 67890))
              credentials = db.execute(
                  "SELECT uuid, subscription_token FROM devices WHERE id = ?", (device["id"],)
              ).fetchone()

          tls = state_path / "node-tls"
          certificate_paths = [tls / "certificate.pem", tls / "private-key.pem"]
          tls_digests = [sha256(path.read_bytes()).digest() for path in certificate_paths]
          initial_panel = invocation(panel_unit)
          initial_node = invocation(node_unit)
          initial_core = sha256(core.read_bytes()).digest()
          launcher = Path(os.environ["RELEASE_ASSETS"]) / "install-from-release.sh"
          subprocess.run(["bash", "-c", launcher.read_text(), "--", "--upgrade"],
                         check=True, stdout=subprocess.DEVNULL)

          subprocess.run(["systemctl", "is-active", "--quiet", panel_unit], check=True)
          subprocess.run(["systemctl", "is-active", "--quiet", node_unit], check=True)
          assert initial_panel and invocation(panel_unit) != initial_panel, "panel did not restart"
          if sha256(core.read_bytes()).digest() != initial_core:
              assert initial_node and invocation(node_unit) != initial_node, "new core did not start"
          assert env_path.read_bytes() == baseline_env, "panel configuration changed"
          assert [sha256(path.read_bytes()).digest() for path in certificate_paths] == tls_digests
          assert device in request(client(), "/api/devices"), "device was not preserved"
          with closing(sqlite3.connect(state_path / "panel.db")) as db:
              assert db.execute("PRAGMA quick_check").fetchone() == ("ok",)
              assert db.execute(
                  "SELECT uuid, subscription_token FROM devices WHERE id = ?", (device["id"],)
              ).fetchone() == credentials
              assert db.execute(
                  "SELECT upload, download FROM traffic_daily WHERE device_id = ? AND day = ?",
                  (device["id"], "2024-05-01")
              ).fetchone() == (12345, 67890)

          assert subprocess.check_output([dsb, "1"], text=True).strip() == release
          menu = subprocess.check_output([dsb], input="1\n", text=True)
          assert all(f"({number})" in menu for number in range(7))
          assert "趣多多流量冠军" in menu
          assert menu.rstrip().endswith(release)
          farewell = "我是趣多多 我为你的流量护航～"
          assert subprocess.check_output([dsb, "0"], text=True).rstrip("\n") == farewell
          assert subprocess.check_output([dsb], input="0\n", text=True).rstrip("\n").endswith(farewell)
          assert subprocess.check_output([dsb, "5"], text=True).rstrip("\n") == "后台管理员密码：" + password
          assert subprocess.check_output([dsb, "6"], text=True).splitlines()[0] == "后台地址：http://8.8.8.8:19443"

          # Test the menu's query and download arguments without contacting a live release.
          with TemporaryDirectory() as directory:
              stub = Path(directory) / "panel"
              stub.write_text("#!/bin/bash\nprintf '%s\\n' \"$@\"\n")
              stub.chmod(0o700)
              fixture = Path(directory) / "dsb"
              fixture.write_text(dsb.read_text().replace("/usr/local/bin/sing-box-panel", str(stub)))
              assert subprocess.check_output(["bash", fixture, "2"], text=True).splitlines() == ["latest"]
              assert subprocess.check_output(["bash", fixture, "3", "/tmp"], text=True).splitlines() == ["download", "/tmp"]

          new_panel = invocation(panel_unit)
          subprocess.run([dsb, "4"], check=True, stdout=subprocess.DEVNULL)
          assert invocation(panel_unit) == new_panel, "reapplying the same release restarted the panel"
          print("Update preserved the configuration, device credentials, TLS keys and traffic.")
          PY

      - name: Show upgrade service diagnostics
        if: failure()
        run: sudo journalctl --no-pager -n 150 -u sing-box-panel.service -u sing-box-panel-node.service -u polkit.service

  publish:
    name: Publish GitHub Release
    needs: [build, test-upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify and publish release assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          core_sources=(sing-box-core-v*-source.zip)
          test "${#core_sources[@]}" -eq 1
          files=(
            install-from-release.sh
            sing-box-panel-linux-amd64.tar.gz
            sing-box-panel-linux-amd64.tar.gz.sha256
            sing-box-panel-linux-arm64.tar.gz
            sing-box-panel-linux-arm64.tar.gz.sha256
            "${core_sources[0]}"
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          sha256sum --check sing-box-panel-linux-{amd64,arm64}.tar.gz.sha256

          if ! release=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft); then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
            release=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft)
          fi
          release_id=$(jq -er .databaseId <<< "$release")
          if [[ $(jq -r .isDraft <<< "$release") == true ]]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          fi

          assets=$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100")
          for file in "${files[@]}"; do
            checksum=$(sha256sum "$file")
            digest=$(jq -er --arg name "$file" '.[] | select(.name == $name and .state == "uploaded") | .digest' <<< "$assets")
            if [[ $digest != "sha256:${checksum%% *}" ]]; then
              printf 'Release asset checksum differs: %s\n' "$file" >&2
              exit 1
            fi
          done
          if [[ $(jq -r .isDraft <<< "$release") == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
