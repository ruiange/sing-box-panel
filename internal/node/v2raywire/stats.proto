// Wire-compatible subset of the sing-box v1.14.4 Stats API. The full
// upstream definition is experimental/v2rayapi/stats.proto.
syntax = "proto3";

package v2ray.core.app.stats.command;

option go_package = "github.com/ruiange/sing-box-panel/internal/node/v2raywire";

message QueryStatsRequest {
  bool reset = 2;
  repeated string patterns = 3;
}

message Stat {
  string name = 1;
  int64 value = 2;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

message SysStatsRequest {}

message SysStatsResponse {
  uint32 uptime = 10;
}
